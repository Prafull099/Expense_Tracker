
spring.application.name=Expense_Tracker

# Load local secrets (application-local.properties) — gitignored, never committed
spring.profiles.active=local

# ─── Database ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/expense_tracker
spring.datasource.username=postgres
spring.datasource.password=prafull08
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Let data.sql run AFTER Hibernate DDL so the backfill UPDATE sees the new column
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── JWT ─────────────────────────────────────────────────────────────────────
# Real secret is in application-local.properties (gitignored)
jwt.expiration=86400000

# ─── OAuth2 Social Login ──────────────────────────────────────────────────────
# Real client-id / client-secret values are in application-local.properties

# Google
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# GitHub
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ─── App Config ───────────────────────────────────────────────────────────────
app.oauth2.redirectUri=http://localhost:5173/oauth2/redirect